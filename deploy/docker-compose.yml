services:
  media-intelligence-api:
    build:
      context: ..
      dockerfile: src/DeValpo.MediaIntelligence.Api/Dockerfile
    container_name: media-intelligence-api
    ports:
      - "8085:8080"
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - media_assets:/app/storage/media-assets
      - ../secrets:/run/secrets:ro

  postgres:
    image: postgres:17-alpine
    container_name: media-intelligence-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-media_intelligence}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d media_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  media_assets:

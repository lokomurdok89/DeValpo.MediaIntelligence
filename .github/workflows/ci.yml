name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore DeValpo.MediaIntelligence.sln

      - name: Build
        run: dotnet build DeValpo.MediaIntelligence.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DeValpo.MediaIntelligence.sln --configuration Release --no-build

      - name: Docker build
        run: docker build -f src/DeValpo.MediaIntelligence.Api/Dockerfile .

      - name: Validate Docker Compose
        run: docker compose -f deploy/docker-compose.yml config
